# Holt jeden Morgen die aktuellen Daten von data.bs.ch und aktualisiert die Baustellen-Karte (karte/data.json).
name: Karte aktualisieren
on:
  schedule:
    - cron: "17 3 * * *"   # täglich ca. 04:17 (Winter) bzw. 05:17 (Sommer) Schweizer Zeit
  workflow_dispatch: {}     # von Hand: Actions → Karte aktualisieren → Run workflow
permissions:
  contents: write
concurrency: karte
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen
        run: python3 -u tools/basel_karte.py karte
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karte/data.json
          git diff --cached --quiet || (git commit -m "Karte: Daten vom $(date +%F)" && git push)
